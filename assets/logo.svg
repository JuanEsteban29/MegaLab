<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem / Isotipo -->
  <g transform="translate(5, 5)">
    <!-- Outer rounded square container -->
    <rect x="0" y="0" width="50" height="50" rx="14" fill="url(#cyanGrad)" opacity="0.18" />
    <rect x="0" y="0" width="50" height="50" rx="14" fill="none" stroke="url(#cyanGrad)" stroke-width="2" />
    
    <!-- Medical Cross + Pulse motif -->
    <path d="M25 11 V39 M11 25 H39" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
    <circle cx="25" cy="25" r="4.5" fill="#00e5ff" />
  </g>

  <!-- Typography -->
  <text x="68" y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="-0.5">
    MEGA <tspan fill="#00e5ff">LAB</tspan>
  </text>
  <text x="69" y="49" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="8.5" fill="#94a3b8" letter-spacing="1.5">
    EQUIPOS &amp; REACTIVOS CLÍNICOS
  </text>
</svg>
